name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release v<versionName> (notes from release-notes/<versionName>.md)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_SHA1: C6:8E:91:99:28:6C:C9:A6:55:41:06:C7:2E:ED:62:20:CC:59:84:BD

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore binary files (base64 in binaries/)
        run: python3 tools/binaries.py unpack

      - name: Generate recovered 1.1.0 jar
        run: python3 recovery/build_recovered_jar.py

      - name: Read version
        id: ver
        run: |
          name=$(sed -nE 's/^\s*versionName\s*=\s*"([^"]+)".*/\1/p' app/build.gradle.kts)
          code=$(sed -nE 's/^\s*versionCode\s*=\s*([0-9]+).*/\1/p' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "versionName=$name versionCode=$code"

      - name: Decide whether to release
        id: rel
        run: |
          rel=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            rel=true
            if [[ "$GITHUB_REF_NAME" != "v${{ steps.ver.outputs.name }}" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match versionName ${{ steps.ver.outputs.name }}"; exit 1
            fi
          fi
          if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.release }}" == true ]]; then rel=true; fi
          echo "release=$rel" >> "$GITHUB_OUTPUT"

      - name: Write signing config
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            if [[ "${{ steps.rel.outputs.release }}" == true ]]; then
              echo "::error::signing secrets are missing; cannot release"; exit 1
            fi
            echo "::warning::signing secrets are not set; building an unsigned APK"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: bash ./gradlew --no-daemon testReleaseUnitTest

      - name: Build release APK
        run: bash ./gradlew --no-daemon assembleRelease

      - name: Collect APK and verify signer
        run: |
          mkdir -p out
          if [[ "${{ steps.sign.outputs.signed }}" == true ]]; then
            cp app/build/outputs/apk/release/app-release.apk out/splinklez.apk
            bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            certs=$("$bt/apksigner" verify --print-certs out/splinklez.apk)
            want=$(echo "$EXPECTED_SHA1" | tr -d ':' | tr 'A-F' 'a-f')
            got=$(echo "$certs" | sed -nE 's/^Signer #1 certificate SHA-1 digest: ([0-9a-f]+)$/\1/p')
            if [[ "$got" != "$want" ]]; then echo "::error::signer SHA-1 $got != expected $want"; exit 1; fi
            echo "Signer SHA-1 OK ($EXPECTED_SHA1)"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk out/splinklez-unsigned.apk
          fi
          sha256sum out/*.apk
          rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: splinklez-${{ steps.ver.outputs.name }}-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.rel.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          notes="release-notes/$VERSION.md"
          [[ -f "$notes" ]] || { echo "::error::missing $notes"; exit 1; }
          title=$(head -1 "$notes")
          tail -n +3 "$notes" > "$RUNNER_TEMP/body.md"
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/splinklez.apk --clobber
            gh release edit "$tag" --title "$title" --notes-file "$RUNNER_TEMP/body.md" --latest
          else
            gh release create "$tag" out/splinklez.apk --target "$GITHUB_SHA" --title "$title" --notes-file "$RUNNER_TEMP/body.md" --latest
          fi
          echo "Released $tag: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
